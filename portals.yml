# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about
# Portal Scanner Configuration
# Customised for macroeconomist / policy / strategist roles

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match.
# Customised for macroeconomist / policy / strategist roles

title_filter:
  positive:
    # --- Macro / Policy (existing) ---
    - "Economist"
    - "Senior Economist"
    - "Macroeconomist"
    - "Policy Economist"
    - "Research Economist"

    - "Monetary"
    - "Macroprudential"
    - "Financial Stability"
    - "Inflation"
    - "Economic Analysis"
    - "Projection"
    - "Forecast"

    - "Strategist"
    - "Macro Strategist"
    - "Global Macro"
    - "Investment Strategist"
    - "Quantitative Strategist"

    - "Model Development"
    - "Macroeconomic Modelling"
    - "DSGE"
    - "Agent-Based"
    - "Quantitative Economist"

    - "Economic Consultant"
    - "Economic Advisory"
    - "Policy Advisor"
    - "Research Fellow"

    # Quant research & finance roles
    - "Quant"
    - "Quantitative Analyst"
    - "Quantitative Researcher"
    - "Research Scientist"
    - "Machine Learning Engineer (Finance)"
    - "Data Scientist (Finance)"
    - "Statistical Analyst"
    - "Risk Analyst"
    - "Portfolio Manager"
    - "Asset Manager"
    - "Investment Manager"
    - "Trader"
    - "Fixed Income"
    - "Derivatives"
    - "Macro Trader"
    - "Systematic Trading"

    # --- Quant Research / Systematic Trading (new) ---
    - "Quant Researcher"
    - "Quantitative Researcher"
    - "Quant Research"
    - "Research Scientist"
    - "Systematic Macro"
    - "Macro Research"
    - "Alpha Research"
    - "Signal Research"
    - "Systematic Researcher"
    - "Quant Strategist"
    - "Quantitative Strategist"
    - "Portfolio Researcher"
    - "Macro Modeller"
    - "Systematic Analyst"

  negative:
    - "Intern"
    - "Internship"
    - "Graduate Programme"
    - "Assistant (Admin)"
    - "Software Engineer"
    - "Frontend"
    - "Backend"
    - "Full Stack"
    - "DevOps"
    - "Sales"
    - "Marketing"
    - "HR"
    - "Recruiter"
    - "Customer Success"
    - "Blockchain"
    - "Crypto"
    - "Game"
    - "Gaming"
    - "Quant Developer"
    - "Quant Engineer"
    # Exclude roles requiring trading/fund mgmt experience (not yet credible)
    - "Portfolio Manager (5+ years)"
    - "P&L responsibility"
    - "Fund Manager"
    - "Equity Trader"
    - "FX Trader"
    - "Derivatives Trader"
    - "Head of Trading"

  seniority_boost:
    - "Senior"
    - "Principal"
    - "Lead"
    - "Advisor"
    - "Head"
    - "Director"

# -- Search queries --

search_queries:
  - name: ECB roles
    query: 'site:ecb.europa.eu "Economist" OR "Monetary" OR "Financial Stability"'
    enabled: true

  - name: IMF roles
    query: 'site:imf.wd1.myworkdayjobs.com "Economist" OR "Macro"'
    enabled: true

  - name: Central bank broad
    query: '"Economist" "central bank" OR "Bank of" macroeconomics'
    enabled: true

  - name: Macro strategist roles
    query: '"Macro Strategist" OR "Global Macro" OR "Investment Strategist" London'
    enabled: true

  - name: Economic consulting
    query: '"Economic Consultant" OR "Policy Economist" OR "Economic Advisory"'
    enabled: true

  - name: Macro modelling roles
    query: '"Model Development" macro OR DSGE OR "macroeconomic modelling"'
    enabled: true

  - name: ImpactPool
    query: 'site:impactpool.org "Economist" OR "Macroeconomics"'
    enabled: true

  - name: UN Jobs
    query: 'site:unjobs.org "Economist" OR "Financial Stability"'
    enabled: true

  - name: eFinancialCareers - Economics
    query: 'site:efinancialcareers.co.uk "Macro" OR "Economist" OR "Strategist"'
    enabled: true

  # --- Quant Research / Systematic Trading ---
  - name: eFinancialCareers - Quant
    query: 'site:efinancialcareers.co.uk "Quant" OR "Quantitative Analyst" OR "Quantitative Researcher"'
    enabled: true

  - name: eFinancialCareers quant
    query: 'site:efinancialcareers.co.uk "Quant Researcher" OR "Quantitative Researcher" OR "Systematic Macro"'
    enabled: true

  - name: Quant researcher hedge funds
    query: '"Quant Researcher" OR "Quantitative Researcher" macro systematic hedge fund'
    enabled: true

  - name: Systematic macro roles Ashby
    query: 'site:jobs.ashbyhq.com "Quant Researcher" OR "Systematic Macro" OR "Macro Research"'
    enabled: true

  - name: Systematic macro roles Greenhouse
    query: 'site:job-boards.greenhouse.io "Quant Researcher" OR "Systematic" OR "Macro Research"'
    enabled: true

  - name: Systematic macro roles Lever
    query: 'site:jobs.lever.co "Quant Researcher" OR "Macro Research" OR "Systematic"'
    enabled: true

  - name: Quant hedge funds
    query: '"Jane Street" OR "Citadel" OR "Bridgewater" OR "Point72" "Quant" OR "Researcher"'
    enabled: true

  - name: Asset manager roles
    query: '"BlackRock" OR "Vanguard" OR "PIMCO" OR "Schroders" "Portfolio Manager" OR "Strategist" OR "Researcher"'
    enabled: true

  - name: Macro trading roles
    query: '"Macro Trader" OR "Global Macro" "hedge fund" OR "asset manager"'
    enabled: true

